[project]
name = "pebbles"
version = "0.5.0"
authors = [
  { name="Matthew Wakefield", email="matthew.wakefield@unimelb.edu.au" },
]
description = "A package for calling HGVS variants in single SAM/BAM alignments"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "pysam >= 0.20.0",
  "pandas",
  "requests",
]

[project.optional-dependencies]
countess = [
    "countess >= 0.0.24, < 0.1"
]
test = [
    "pytest",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -v --showlocals"
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"

[project.scripts]
pebbles = "pebbles.pebbles:main"

[project.entry-points.countess_plugins]
count_SAM = "pebbles.countess:CountSAMPlugin"
count_BAM = "pebbles.countess:CountBAMPlugin"

[tool.setuptools]
# Ensures the bundled assembly reports are included in the .whl and sdist
packages = ["pebbles", "pebbles.data.assemblies"]

[tool.setuptools.package-data]
# This line is critical: it looks for the .txt files generated by your build script
"pebbles.data.assemblies" = ["*.txt"]

[project.urls]
"Homepage" = "https://github.com/genomematt/pebbles"
"Bug Tracker" = "https://github.com/genomematt/pebbles"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pebbles", "tests"]

